name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, testes e validação dos artefatos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (estilo)
        run: python -m ruff check .

      - name: Pytest (suíte offline)
        run: python -m pytest -q

      - name: Sintaxe do front-end
        run: node --check frontend/app.js

      - name: Validar configurações
        run: |
          python -c "import json, pathlib; json.loads(pathlib.Path('vercel.json').read_text())"
          python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('docker-compose.yml').read_text()); yaml.safe_load(pathlib.Path('render.yaml').read_text())"

      - name: Validar Dockerfile e Compose
        run: |
          docker compose config -q
          docker build -t variantscope:ci .
